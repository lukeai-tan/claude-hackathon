name: Feature request
description: Suggest a new capability or an improvement
labels: ["type: feature", "status: needs-triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of OpenSuite would this touch?
      options:
        - OpenPDF
        - OpenSlides
        - Suite (home / launcher / shell)
        - Homepage (website)
        - CI / build / release
        - Cross-cutting / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the motivation or the gap you're hitting today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
