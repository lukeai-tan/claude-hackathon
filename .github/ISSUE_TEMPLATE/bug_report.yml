name: Bug report
description: Report something that isn't working correctly
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. The more detail below, the faster it can be fixed.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of OpenSuite is affected?
      options:
        - OpenPDF
        - OpenSlides
        - Suite (home / launcher / shell)
        - Homepage (website)
        - CI / build / release
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - Other / N/A
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenSuite version
      description: From the installer filename or About screen (e.g. 0.3.0). Leave blank if unknown.
      placeholder: "0.3.0"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any error output or attach screenshots. Text here is automatically formatted as code.
      render: shell
