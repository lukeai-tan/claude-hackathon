name: Label PRs by area
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
# pull_request_target so labeling also works on PRs from forks (which get a
# read-only token under the plain pull_request event). labeler only reads the
# changed-file list and applies labels — it never checks out or runs PR code.
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
