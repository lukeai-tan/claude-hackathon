name: OpenSuite build and release
on:
  push:
    branches: [master, pdf-build-12]
  pull_request:
    # Docs/metadata-only PRs don't need the full installer build + smoke run.
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'LICENSE'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: opensuite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source-code/OpenSlides/package-lock.json
      - run: npm ci --prefix source-code/OpenSlides
      - run: npm test
      - run: npm test --prefix source-code/OpenSlides
      - run: npm run build:web
      - run: npm install --prefix source-code/OpenSlides/.qa --no-package-lock playwright@1.62.1
      - run: npx --prefix source-code/OpenSlides/.qa playwright install --with-deps chromium
      - name: Browser checks
        shell: bash
        run: |
          npm run dev --prefix source-code/OpenSlides -- --host 127.0.0.1 > /tmp/openslides-vite.log 2>&1 &
          python3 -m http.server 4173 --directory site > /tmp/opensuite-http.log 2>&1 &
          for attempt in {1..30}; do curl --silent --fail http://127.0.0.1:5173 > /dev/null && break; sleep 1; done
          (cd source-code/OpenSlides && node scripts/browser-smoke.mjs)
          node scripts/home-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Browser-screenshots
          path: |
            source-code/OpenSlides/studio-*.png
            opensuite-home-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSuite-website
          path: site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source-code/OpenSlides/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source-code/OpenPDF/requirements.txt
      # electron-builder downloads the Electron runtime + packaging binaries from
      # GitHub's release CDN; caching them survives transient 504s and speeds builds.
      - name: Cache Electron and builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('source-code/main/desktop/builder.cjs', 'source-code/OpenSlides/desktop/builder.cjs') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci --prefix source-code/OpenSlides
      - run: npm run desktop:install --prefix source-code/OpenSlides
      - run: python -m pip install -r source-code/OpenPDF/requirements.txt
      - name: PDF engine tests and benchmarks
        working-directory: source-code/OpenPDF
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'PDF tests failed' }
          python benchmarks/editor.py
          if ($LASTEXITCODE -ne 0) { throw 'PDF benchmark failed' }
      - name: Install bundled OCR runtime
        run: choco install tesseract --yes --no-progress
      - name: Check OpenPDF workspace
        working-directory: source-code/OpenPDF
        timeout-minutes: 3
        env:
          OPENPDF_UI_CAPTURE: '1'
        run: |
          python app.py --self-test
          $result = $LASTEXITCODE
          Get-Content smoke-output.log | Where-Object { $_ -notmatch '^UI_CAPTURE' }
          if ($result -ne 0) { throw 'Source GUI check failed' }
      - name: Build OpenPDF with OCR
        working-directory: source-code/OpenPDF
        run: |
          $ocrPath = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path "$ocrPath\tesseract.exe")) { throw 'Tesseract missing' }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name OpenPDF --collect-all pymupdf --collect-all pdf2docx --collect-submodules fontTools.ttLib.tables --collect-all pyhanko --collect-all pyhanko_certvalidator --collect-all asn1crypto --add-data "$ocrPath;tesseract" --add-data "LICENSE;." --add-data "THIRD_PARTY.md;." app.py
          if ($LASTEXITCODE -ne 0) { throw 'OpenPDF build failed' }
      - name: Build standalone OpenSlides
        run: npm run desktop:build --prefix source-code/OpenSlides
      - name: Check standalone OpenSlides
        working-directory: source-code/OpenSlides
        timeout-minutes: 3
        run: |
          $app = Start-Process -FilePath 'release/win-unpacked/OpenSlides.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw 'OpenSlides launch failed' }
      - name: Build combined OpenSuite
        run: npm run build:desktop
      - name: Check suite and both bundled editors
        timeout-minutes: 5
        run: |
          $app = Start-Process -FilePath 'release/win-unpacked/OpenSuite.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if (Test-Path opensuite-smoke.json) { Get-Content opensuite-smoke.json }
          if ($app.ExitCode -ne 0) { throw 'OpenSuite launch or bundled editor check failed' }
      - name: Collect standalone apps and checksums
        run: |
          Copy-Item source-code/OpenPDF/dist/OpenPDF.exe release/
          Copy-Item source-code/OpenSlides/release/*.exe release/
          Get-ChildItem release/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-checks
          path: |
            source-code/OpenPDF/openpdf-*.png
            source-code/OpenPDF/smoke-output.log
            opensuite-*.png
            opensuite-smoke.json
            opensuite-pdf-check.log
      # One artifact per deliverable so a specific installer/binary can be
      # downloaded on its own instead of the whole bundle.
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSuite-Setup-Windows
          path: release/OpenSuite-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSuite-Portable-Windows
          path: release/OpenSuite-Portable-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSlides-Windows
          path: release/OpenSlides-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPDF-Windows
          path: release/OpenPDF.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Checksums-Windows
          path: release/SHA256SUMS.txt
      - name: Publish Windows release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw 'No version in package.json' }
          $tag = "v$version"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::notice::Release $tag already exists; skipping publish. Bump 'version' in package.json to cut a new release."
          } else {
            gh release create $tag release/*.exe release/SHA256SUMS.txt --target '${{ github.sha }}' --title "OpenSuite $tag" --notes-file source-code/OpenPDF/RELEASE-NOTES.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
  linux:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source-code/OpenSlides/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source-code/OpenPDF/requirements.txt
      # electron-builder downloads the Electron runtime + fpm from GitHub's release
      # CDN; caching them survives transient 504s and speeds builds.
      - name: Cache Electron and builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('source-code/main/desktop/builder.cjs', 'source-code/OpenSlides/desktop/builder.cjs') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Install display, OCR and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tesseract-ocr fakeroot
          # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci --prefix source-code/OpenSlides
      - run: npm run desktop:install --prefix source-code/OpenSlides
      - name: Build and check OpenPDF
        env:
          OPENPDF_UI_CAPTURE: '1'
        run: |
          source-code/OpenPDF/build-linux.sh
          python source-code/OpenPDF/benchmarks/editor.py
      - name: Build standalone OpenSlides
        run: npm run desktop:build --prefix source-code/OpenSlides
      - name: Check standalone OpenSlides
        working-directory: source-code/OpenSlides
        timeout-minutes: 3
        run: xvfb-run -a release/linux-unpacked/openslides --smoke-test
      - name: Build combined OpenSuite
        run: npm run build:desktop
      - name: Check suite and both bundled editors
        timeout-minutes: 5
        run: |
          status=0
          xvfb-run -a release/linux-unpacked/opensuite --smoke-test || status=$?
          cat opensuite-smoke.json || true
          rm -f opensuite-smoke.json
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a release/OpenSuite-*.AppImage --smoke-test || status=$?
          cat opensuite-smoke.json || true
          exit $status
      - name: Collect standalone apps and checksums
        run: |
          cp source-code/OpenPDF/dist/OpenPDF release/OpenPDF-linux-x86_64
          cp source-code/OpenSlides/release/*.AppImage release/
          (cd release && sha256sum *.AppImage *.deb OpenPDF-linux-x86_64 > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-checks
          path: |
            source-code/OpenPDF/openpdf-*.png
            source-code/OpenPDF/smoke-output.log
            opensuite-*.png
            opensuite-smoke.json
            opensuite-pdf-check.log
      # One artifact per deliverable so a specific build can be downloaded alone.
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSuite-AppImage-Linux
          path: release/OpenSuite-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSuite-deb-Linux
          path: release/OpenSuite-*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSlides-AppImage-Linux
          path: release/OpenSlides-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPDF-Linux
          path: release/OpenPDF-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Checksums-Linux
          path: release/SHA256SUMS-linux.txt
  linux-release:
    if: github.ref == 'refs/heads/master'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-Linux'
          path: release
          merge-multiple: true
      - name: Attach Linux builds to this commit's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.target_commitish == "${{ github.sha }}")][0].tag_name')
          if [ -z "$tag" ] || [ "$tag" = null ]; then echo '::notice::No release for this commit (version unchanged); skipping Linux upload.'; exit 0; fi
          gh release upload "$tag" release/* --repo "${{ github.repository }}" --clobber
  homepage:
    if: github.ref == 'refs/heads/master'
    needs: [verify, windows]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/github-script@v7
        id: pages
        with:
          script: |
            try {
              await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('enabled', 'false');
              core.notice('Homepage is built and included in OpenSuite. To publish the web version, a repository owner must enable Settings > Pages > GitHub Actions, then rerun this workflow.');
            }
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
