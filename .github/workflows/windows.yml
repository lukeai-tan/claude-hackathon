name: Build Windows EXE
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test PDF engine
        run: python -m unittest discover -s tests -v
      - name: Install OCR runtime
        run: choco install tesseract --yes --no-progress
      - name: Test desktop controls before packaging
        timeout-minutes: 2
        shell: pwsh
        run: |
          python app.py --self-test
          Get-Content smoke-output.log
          if ($LASTEXITCODE -ne 0) { throw 'Source GUI smoke test failed' }
      - name: Build executable with English OCR
        shell: pwsh
        run: |
          $ocrPath = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path "$ocrPath\tesseract.exe")) { throw 'Tesseract installation missing' }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name OpenPDF-Studio --collect-all pymupdf --collect-all pdf2docx --collect-submodules fontTools.ttLib.tables --add-data "$ocrPath;tesseract" --add-data "LICENSE;." --add-data "THIRD_PARTY.md;." app.py
      - name: Test packaged executable
        timeout-minutes: 5
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist\OpenPDF-Studio.exe' -ArgumentList '--self-test' -Wait -PassThru
          if (Test-Path smoke-output.log) { Get-Content smoke-output.log }
          if ($process.ExitCode -ne 0) { throw "Executable smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPDF-Studio-Windows
          path: dist/OpenPDF-Studio.exe
      - name: Publish downloadable executable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'build-${{ github.run_number }}'
          gh release create $tag dist/OpenPDF-Studio.exe --title "OpenPDF Studio build ${{ github.run_number }}" --target '${{ github.sha }}' --notes 'Windows portable EXE: drag sidebar thumbnails to reorder pages; create, move and resize live text boxes; format selected letters; choose text colour, box fill, outline and alignment. Includes undo/redo, editable Word export, PDF text selection/search/redaction and English OCR. See README for limits. Unsigned executable.'
